<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero yläreunassa laidasta laitaan</title>
    <style>
        /* Määritellään värit muuttujilla sivun yläosaan */
        :root {
            --background: #f8f9fa;          /* Sivun päätausta */
            --surface: white;              /* Valkoinen kortin pinta */
            --text: black;                 /* Musta teksti */
            --accent: rgb(250, 146, 198);  /* Vaaleanpunainen korostusväri */
            --on-accent: white;            /* Teksti painikkeen päällä */
            --hero-bg: #ff007717;          /* Sinun vaaleanpunainen hero-taustasi */
            --danger: red;                 /* Punainen danger-väri */
        }

        /* Nollataan marginaalit, jotta hero pääsee aivan reunoihin kiinni */
        body {
            font-family: sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* HERO-OSIO: Koko yläreunan leveydeltä laidasta laitaan */
        .hero {
            background-color: var(--hero-bg);
            width: 100%;                   /* Täyttää 100% leveydestä vasemmalta oikealle */
            padding: 60px 0;               /* Ilmaa ylä- ja alapuolelle */
            text-align: center;            /* Keskittää tekstin heron sisällä */
            border-bottom: 1px solid rgba(250, 146, 198, 0.3);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: #b7094c;
        }

        .hero p {
            font-size: 1.1rem;
            margin: 0;
            color: #555;
        }

        /* Sisältöalue heron alapuolella (keskittää kortin) */
        .sisalto-alue {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Pinta elementtinä (article / kortti) */
        article {
            background-color: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
            width: 320px;
            text-align: center;
        }

        /* Painikkeiden perustyyli */
        button {
            background-color: var(--accent);
            color: var(--on-accent);
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        /* Ilmoitusten perustyyli (aluksi piilossa) */
        .ilmoitus {
            display: none;
            margin-top: 10px;
            color: green;
            font-weight: bold;
        }

        .ilmoitus-danger {
            display: none;
            margin-top: 10px;
            color: var(--danger);
            font-weight: bold;
            font-size: 14px;
            padding: 8px;
            background-color: #ffeef2;
            border-radius: 4px;
        }
    </style>
</head>
<body>
        <!-- 4. SIVUN ALALAITA: Klikattava kuva suoraan netistä (Helsingin Pohjoisranta) -->
    <section class="alaosa-kuva-alue">
        <h2>HELSINGIN POHJOISRANTA</h2>
       
        
        <a href="pora.html">
            <!-- src-kohdassa on nyt lähettämäsi kuvan suora nettiosoite -->
            <img src="https://www.shutterstock.com/image-photo/helsinki-city-skyline-cityscape-finland-260nw-2464004453.jpg" alt="Helsingin Pohjoisranta - Siirry porasivulle">
        </a>
    </section>


 <!-- HERO-OSIO: Aivan ylhäällä vasemmasta reunasta oikeaan reunaan -->
    <header class="hero">
        <h1>Kortin Otsikko</h1>
        <p>Tämä sivu toimii nyt palvelimellasi ja näyttää punaisen korostuksen</p>
    </header>

    <!-- Korttialue, joka tulee Heron alapuolelle -->
    <main class="sisalto-alue">
        <article>
            <h2>Otsikko</h2>
            <p>Tämä on kortti</p>
            
            <button onclick="nayta()">Klikkaa painiketta</button>
            <p id="teksti" class="ilmoitus">Klikattu! ✔</p>
                
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <button onclick="naytaVirhe()">Kriittinen toiminto</button>
            <p id="virheTeksti" class="ilmoitus-danger">Danger! Toiminto epäonnistui. ⚠️</p>
        </article>
    </main>

    <script>
        function nayta() {
            document.getElementById("teksti").style.display = "block";
        }
        
        function naytaVirhe() {
            document.getElementById("virheTeksti").style.display = "block";
        }
    </script>

</body>
</html>
